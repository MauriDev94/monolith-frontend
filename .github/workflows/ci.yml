name: 01 - Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # FE-1-008 lands Vitest + a placeholder suite. Until that PR merges, this
      # step is allowed to fail without blocking CI; remove the override once
      # Vitest is in place.
      - name: Test
        run: pnpm test --run
        continue-on-error: true

      - name: Build
        run: pnpm build